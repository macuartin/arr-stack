# Nombre de proyecto fijo: independiente del nombre de la carpeta
# (evita que un `mv` del repo orfane los contenedores).
name: arr-stack

# Variables PUID/PGID/TZ se leen de .env (ver .env.example)
x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Europe/Madrid}

# Rotación de logs: evita que los logs de Docker llenen el disco
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    # Ola 2: espera a indexer + cliente torrent sanos
    depends_on:
      prowlarr:
        condition: service_healthy
      transmission:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./sonarr/config:/config
      - ./media:/media
    ports:
      - 8989:8989
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    # Ola 2: espera a indexer + cliente torrent sanos
    depends_on:
      prowlarr:
        condition: service_healthy
      transmission:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./radarr/config:/config
      - ./media:/media
    ports:
      - 7878:7878
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  transmission:
    image: linuxserver/transmission:latest
    container_name: transmission
    environment:
      <<: *common-env
    volumes:
      - ./transmission/config:/config
      - ./media:/media
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9091/transmission/web/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
    volumes:
      - ./prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  plex:
    image: linuxserver/plex:latest
    container_name: plex
    network_mode: host
    # Ola 3: arranca tras los *arr para no competir por CPU/NVMe en el cold-start
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    environment:
      <<: *common-env
      VERSION: docker
    volumes:
      - ./plex/config:/config
      - ./media:/media
    tmpfs:
      # Transcode en RAM: más rápido y sin escrituras a disco (ver TranscoderTempDirectory en Plex)
      - /transcode:size=2g,mode=1777
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:32400/identity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  lidarr:
    image: linuxserver/lidarr:latest
    container_name: lidarr
    # Ola 2: espera a indexer + cliente torrent sanos
    depends_on:
      prowlarr:
        condition: service_healthy
      transmission:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./lidarr/config:/config
      - ./media:/media
    ports:
      - 8686:8686
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8686/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    # Ola 3: necesita a los *arr sanos para mapear series/pelis
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      lidarr:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./bazarr/config:/config
      - ./media:/media
    ports:
      - 6767:6767
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:6767/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Servicios "pro" ──────────────────────────────────────────

  # Gestión de peticiones (frontend tipo Netflix para usuarios de Plex)
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    # Ola 4: frontend de peticiones, depende de plex + *arr
    depends_on:
      plex:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Madrid}
      LOG_LEVEL: info
      PORT: 5055
    volumes:
      - ./seerr/config:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/settings/public"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Monitoreo y estadísticas de Plex
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    # Ola 4: monitorea Plex, arranca después de él
    depends_on:
      plex:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./tautulli/config:/config
    ports:
      - 8181:8181
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8181/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Sincroniza custom formats y quality definitions de TRaSH Guides (cron diario)
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    # Ola 4: sincroniza contra sonarr/radarr, los necesita sanos
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    environment:
      <<: *common-env
      CRON_SCHEDULE: "@daily"
    volumes:
      - ./recyclarr/config:/config
    restart: unless-stopped
    logging: *default-logging

  # Expone seerr a internet vía Cloudflare Tunnel (token-managed).
  # El enrutado public-hostname -> http://seerr:5055 se configura en el
  # dashboard de Cloudflare Zero Trust (Networks > Tunnels).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: arr-cloudflared
    command: tunnel run
    environment:
      TZ: ${TZ:-Europe/Madrid}
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      seerr:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
