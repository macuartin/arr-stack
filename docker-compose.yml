# Nombre de proyecto fijo: independiente del nombre de la carpeta
# (evita que un `mv` del repo orfane los contenedores).
name: arr-stack

# Variables PUID/PGID/TZ se leen de .env (ver .env.example)
x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Europe/Madrid}

# Rotación de logs: evita que los logs de Docker llenen el disco
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    # Ola 2: espera a indexer + cliente torrent sanos
    depends_on:
      prowlarr:
        condition: service_healthy
      transmission:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./sonarr/config:/config
      - ./media:/media
    ports:
      - 8989:8989
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    # Ola 2: espera a indexer + cliente torrent sanos
    depends_on:
      prowlarr:
        condition: service_healthy
      transmission:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./radarr/config:/config
      - ./media:/media
    ports:
      - 7878:7878
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  transmission:
    image: linuxserver/transmission:latest
    container_name: transmission
    environment:
      <<: *common-env
    volumes:
      - ./transmission/config:/config
      - ./media:/media
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9091/transmission/web/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
    volumes:
      - ./prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Resuelve los desafios de Cloudflare de los trackers (indexer proxy de Prowlarr)
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      <<: *common-env
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
    ports:
      - 8191:8191
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8191/health | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  jellyfin:
    image: linuxserver/jellyfin:latest
    container_name: jellyfin
    # Ola 3 (como Plex): arranca tras los *arr para no competir en el cold-start
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    environment:
      <<: *common-env
    ports:
      # Publicado SOLO en la IP de la LAN, no en 0.0.0.0, y esto es deliberado:
      # el cliente de AWS VPN usa 127.0.0.1:8096 como interfaz de gestion de su
      # openvpn (--management 127.0.0.1 8096). Atarse a 0.0.0.0 se lo robaria y
      # la VPN dejaria de conectar, que es peor que cualquier molestia de
      # Jellyfin. Asi conviven: la VPN se queda su localhost y los clientes
      # tienen el puerto por defecto, que es lo que espera el autodescubrimiento.
      #
      # Contrapartida: queda atado a esta IP, que es DHCP. Si cambia, Jellyfin
      # no arranca (fallo visible, no silencioso). Conviene reserva en el router.
      - "192.168.68.70:8096:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./media:/media
    # Transcodificacion por hardware: la Radeon 8060S de la Framework SI tiene
    # encoders (motores VCN), al contrario que la Pi. render es el grupo dueño
    # de renderD128 y hace falta para que el contenedor pueda abrirlo.
    devices:
      - /dev/dri:/dev/dri
    # GIDs numericos, no nombres: la imagen de linuxserver trae 'video' (44) pero
    # NO trae 'render', asi que por nombre no resolveria y el contenedor no
    # podria abrir /dev/dri/renderD128. 992 es el gid de render en la Framework.
    group_add:
      - "992"
      - "44"
    # El transcode va a tmpfs y no a /config/cache: aqui sobra RAM y evita
    # castigar el NVMe con escrituras que se tiran a los 5 minutos.
    tmpfs:
      - /transcode:size=8g
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  lidarr:
    image: linuxserver/lidarr:latest
    container_name: lidarr
    # Ola 2: espera a indexer + cliente torrent sanos
    depends_on:
      prowlarr:
        condition: service_healthy
      transmission:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./lidarr/config:/config
      - ./media:/media
    ports:
      - 8686:8686
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8686/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    # Ola 3: necesita a los *arr sanos para mapear series/pelis
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      lidarr:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./bazarr/config:/config
      - ./media:/media
    ports:
      - 6767:6767
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:6767/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Servicios "pro" ──────────────────────────────────────────

  # Gestión de peticiones (frontend tipo Netflix, login con Jellyfin)
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    # Ola 4: frontend de peticiones, depende de jellyfin + *arr
    depends_on:
      jellyfin:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Madrid}
      LOG_LEVEL: info
      PORT: 5055
    volumes:
      - ./seerr/config:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/settings/public"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Monitoreo y estadísticas de Plex
  # Sincroniza custom formats y quality definitions de TRaSH Guides (cron diario)
  recyclarr:
    # Version fija, no :latest. Upstream dejo de publicar el tag 'latest' en
    # ghcr y solo sube tags de version; la raspi seguia funcionando con una
    # imagen cacheada de cuando existia. Al migrar el 2026-08-17 el pull fallo
    # con "not found" y aborto el arranque del stack entero.
    image: ghcr.io/recyclarr/recyclarr:7.4.0
    container_name: recyclarr
    # Ola 4: sincroniza contra sonarr/radarr, los necesita sanos
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    environment:
      <<: *common-env
      CRON_SCHEDULE: "@daily"
    volumes:
      - ./recyclarr/config:/config
    restart: unless-stopped
    logging: *default-logging

  # Expone seerr a internet vía Cloudflare Tunnel (token-managed).
  # El enrutado public-hostname -> http://seerr:5055 se configura en el
  # dashboard de Cloudflare Zero Trust (Networks > Tunnels).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: arr-cloudflared
    command: tunnel run
    environment:
      TZ: ${TZ:-Europe/Madrid}
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      seerr:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Exportadores de metricas para Prometheus.
  #
  # Viven aqui y no en el compose de monitoring a proposito: cuando este stack
  # migre a la Framework, sus exportadores viajan con el. Prometheus los alcanza
  # por puerto de host (host.docker.internal), no por red compartida, asi que
  # tras la migracion solo cambia la direccion en prometheus.yml.
  #
  # Sin bazarr (exportarr no lo soporta), ni jellyfin ni transmission (sin
  # exportador fiable en arm64). Los tres siguen cubiertos por cAdvisor y Loki.
  # ---------------------------------------------------------------------------
  sonarr-exporter:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: sonarr-exporter
    command: ["sonarr"]
    environment:
      PORT: 9707
      URL: "http://sonarr:8989"
      APIKEY: ${SONARR_API_KEY:?falta SONARR_API_KEY en .env}
    ports:
      - 9707:9707
    depends_on:
      sonarr:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  radarr-exporter:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: radarr-exporter
    command: ["radarr"]
    environment:
      PORT: 9708
      URL: "http://radarr:7878"
      APIKEY: ${RADARR_API_KEY:?falta RADARR_API_KEY en .env}
    ports:
      - 9708:9708
    depends_on:
      radarr:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  lidarr-exporter:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: lidarr-exporter
    command: ["lidarr"]
    environment:
      PORT: 9709
      URL: "http://lidarr:8686"
      APIKEY: ${LIDARR_API_KEY:?falta LIDARR_API_KEY en .env}
    ports:
      - 9709:9709
    depends_on:
      lidarr:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # Es el que mas interesa ahora mismo: expone la salud de los indexers, que es
  # donde estan los 429 TooManyRequests que Prowlarr devuelve a sonarr y radarr.
  prowlarr-exporter:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: prowlarr-exporter
    command: ["prowlarr"]
    environment:
      PORT: 9710
      URL: "http://prowlarr:9696"
      APIKEY: ${PROWLARR_API_KEY:?falta PROWLARR_API_KEY en .env}
    ports:
      - 9710:9710
    depends_on:
      prowlarr:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
